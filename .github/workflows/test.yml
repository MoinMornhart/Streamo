# ---------------------------------------------------------------------------
# .github/workflows/test.yml – Automatischer Test bei jedem Push
# ---------------------------------------------------------------------------
# Prüft zweierlei, damit ein kaputter Stand gar nicht erst im Hauptzweig landet:
#   1. Die Kernlogik (tests/store.test.mjs) – Verfügbarkeit, Abo-Abgleich,
#      Fortschritt, Fremdschlüssel. Läuft ohne TMDB-Key und ohne Netzwerk.
#   2. Die Shell-Skripte – ein Syntaxfehler im Proxmox-Installer würde sonst
#      erst auf dem Server auffallen, mitten in der Installation.
# ---------------------------------------------------------------------------

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Quellen auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          # Node 24, weil Streamo das eingebaute node:sqlite verwendet.
          node-version: '24'

      - name: Abhängigkeiten installieren
        run: npm install --omit=dev --no-audit --no-fund

      - name: Kernlogik testen
        run: npm test

      - name: Migration bestehender Datenbanken testen
        run: npm run test:migration

      - name: Erfolge und Anbieter-Zusammenfassung testen
        run: npm run test:achievements

      - name: Filmreihen testen
        run: npm run test:collections

      - name: Freunde testen
        run: npm run test:friends

      - name: Einladungen testen
        run: npm run test:invites

      - name: Serverstart prüfen
        # Startet den Server im Hintergrund und fragt /api/health ab. Damit ist
        # sichergestellt, dass alle Module fehlerfrei laden und das Schema
        # angelegt werden kann.
        run: |
          DATA_DIR=/tmp/streamo-ci PORT=3123 node src/server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3123/api/health >/dev/null 2>&1; then
              echo "Server antwortet:"
              curl -s http://127.0.0.1:3123/api/health
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server ist nicht hochgekommen."
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  shell:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax der Shell-Skripte prüfen
        run: |
          bash -n scripts/streamo.sh
          bash -n scripts/streamo-update.sh
          bash -n scripts/install/streamo-install.sh
          bash -n scripts/install/install-commands.sh
          echo "Shell-Skripte sind syntaktisch in Ordnung."

      - name: Erzeugte Konsolenbefehle prüfen
        # install-commands.sh schreibt Skripte per Here-Dokument. Ein Fehler
        # beim Maskieren fiele sonst erst im Container auf – hier wird die
        # Datei in eine Sandbox erzeugt und ihre Syntax geprüft.
        run: |
          SANDBOX="$(mktemp -d)"
          mkdir -p "$SANDBOX/bin" "$SANDBOX/motd"
          sed -e "s|/usr/local/bin|$SANDBOX/bin|g" \
              -e "s|/etc/update-motd.d|$SANDBOX/motd|g" \
              -e "s|>/etc/motd|>$SANDBOX/motdfile|g" \
              scripts/install/install-commands.sh > "$SANDBOX/run.sh"
          bash "$SANDBOX/run.sh"
          for f in "$SANDBOX/bin"/* "$SANDBOX/motd"/*; do
            bash -n "$f" || exit 1
            echo "  ok $(basename "$f")"
          done

      - name: Template-Auswahl testen
        run: npm run test:template

      - name: Update-Vorgang testen
        # Spielt ein vollständiges Update gegen ein Attrappen-Repository durch,
        # inklusive Rollback bei fehlgeschlagenem Neustart.
        run: npm run test:update
