# ---------------------------------------------------------------------------
# .github/workflows/desktop.yml – Baut die Windows-App
# ---------------------------------------------------------------------------
# Warum? Damit niemand die Desktop-App selbst übersetzen muss. GitHub baut den
# Installer auf einem echten Windows-Rechner, und man lädt am Ende nur noch
# eine fertige "Streamo-Setup-1.0.0.exe" herunter.
#
# Wann läuft der Bau?
#   - Bei jeder Änderung unter desktop/ auf dem Hauptzweig: Das Ergebnis hängt
#     dann 90 Tage als "Artefakt" am Arbeitslauf. Gut zum Ausprobieren.
#   - Bei einem Tag wie "v1.1.0": Dann entsteht zusätzlich eine
#     Veröffentlichung, an der die .exe dauerhaft zum Herunterladen hängt.
#   - Von Hand über "Run workflow" in der Actions-Oberfläche.
#
# Hinweis zur Signatur: Der Installer ist nicht signiert – dafür bräuchte es
# ein kostenpflichtiges Zertifikat. Windows SmartScreen zeigt deshalb beim
# ersten Start eine Warnung ("Windows hat den Start geschützt"). Über
# "Weitere Informationen" -> "Trotzdem ausführen" geht es weiter. Das ist bei
# quelloffenen Programmen ohne Firma dahinter der Normalfall.
# ---------------------------------------------------------------------------

name: Desktop-App

on:
  push:
    branches: [main]
    # Nur bauen, wenn sich an der App auch wirklich etwas geändert hat –
    # sonst liefe der Bau bei jeder Änderung am Server mit.
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
    tags:
      - 'v*'
  # Ermöglicht den Start von Hand.
  workflow_dispatch:

# Das Token eines Arbeitslaufs darf standardmäßig nur lesen. Zum Anlegen einer
# Veröffentlichung braucht es Schreibrechte auf den Inhalt des Repositories –
# ohne diese Zeilen scheitert der letzte Schritt mit "403 Resource not
# accessible by integration". Bewusst nur diese eine Berechtigung.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Quellen auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Symbole erzeugen
        # Die Symboldateien liegen zwar im Repository, werden aber sicherheits-
        # halber neu erzeugt: So kann das Symbol nie zum Code auseinanderlaufen.
        working-directory: desktop
        run: node tools/make-icons.mjs

      - name: Abhängigkeiten installieren
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Installer bauen
        working-directory: desktop
        # electron-builder lädt beim ersten Lauf Electron selbst herunter,
        # das dauert einige Minuten.
        run: npm run build:win

      - name: Ergebnis anhängen
        uses: actions/upload-artifact@v4
        with:
          name: Streamo-Windows-Installer
          # Nur den Installer und die Prüfsummen, nicht das gesamte
          # entpackte Programmverzeichnis (mehrere hundert Megabyte).
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
          retention-days: 90
          if-no-files-found: error

      - name: An die Veröffentlichung hängen
        # Nur bei einem Tag – dann entsteht eine dauerhafte Download-Seite.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
          # Der Text der Veröffentlichung wird aus den Commits erzeugt.
          generate_release_notes: true
          body: |
            ## Streamo für Windows

            **Streamo-Setup-*.exe** herunterladen und ausführen.

            Beim ersten Start fragt die App nach der Adresse deines
            Streamo-Servers – dieselbe, die du im Browser aufrufst.

            > Windows zeigt beim ersten Start eine SmartScreen-Warnung, weil der
            > Installer nicht signiert ist. Über *Weitere Informationen* →
            > *Trotzdem ausführen* geht es weiter.

            Der Server selbst wird auf Proxmox installiert:
            ```
            bash -c "$(curl -fsSL https://raw.githubusercontent.com/MoinMornhart/Streamo/main/scripts/streamo.sh)"
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
