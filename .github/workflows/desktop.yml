# ---------------------------------------------------------------------------
# .github/workflows/desktop.yml – Baut die Windows-App
# ---------------------------------------------------------------------------
# Warum? Damit niemand die Desktop-App selbst übersetzen muss. GitHub baut den
# Installer auf einem echten Windows-Rechner, und man lädt am Ende nur noch
# eine fertige "Streamo-Setup-1.0.0.exe" herunter.
#
# Wann läuft der Bau?
#   - Bei jeder Änderung unter desktop/ auf dem Hauptzweig: Das Ergebnis hängt
#     dann 90 Tage als "Artefakt" am Arbeitslauf. Gut zum Ausprobieren.
#   - Bei einem Tag wie "v1.1.0": Dann entsteht zusätzlich eine
#     Veröffentlichung, an der die .exe dauerhaft zum Herunterladen hängt.
#   - Von Hand über "Run workflow" in der Actions-Oberfläche.
#
# Hinweis zur Signatur: Der Installer ist nicht signiert – dafür bräuchte es
# ein kostenpflichtiges Zertifikat. Windows SmartScreen zeigt deshalb beim
# ersten Start eine Warnung ("Windows hat den Start geschützt"). Über
# "Weitere Informationen" -> "Trotzdem ausführen" geht es weiter. Das ist bei
# quelloffenen Programmen ohne Firma dahinter der Normalfall.
# ---------------------------------------------------------------------------

name: Desktop-App

on:
  push:
    branches: [main]
    # Nur bauen, wenn sich an der App auch wirklich etwas geändert hat –
    # sonst liefe der Bau bei jeder Änderung am Server mit.
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
    tags:
      - 'v*'
  # Ermöglicht den Start von Hand.
  workflow_dispatch:

# Das Token eines Arbeitslaufs darf standardmäßig nur lesen. Zum Anlegen einer
# Veröffentlichung braucht es Schreibrechte auf den Inhalt des Repositories –
# ohne diese Zeilen scheitert der letzte Schritt mit "403 Resource not
# accessible by integration". Bewusst nur diese eine Berechtigung.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Quellen auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Version aus dem Tag übernehmen
        # Entscheidend für die Selbstaktualisierung: electron-updater
        # vergleicht die installierte Version mit der in der Veröffentlichung.
        # Bliebe hier immer "1.0.0" stehen, gäbe es aus seiner Sicht nie ein
        # Update – egal wie oft neu gebaut wird.
        #
        # Läuft nur bei einem Tag wie "v1.2.0"; bei gewöhnlichen Pushes bleibt
        # die Version aus der package.json stehen.
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setze Version auf $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Symbole erzeugen
        # Die Symboldateien liegen zwar im Repository, werden aber sicherheits-
        # halber neu erzeugt: So kann das Symbol nie zum Code auseinanderlaufen.
        working-directory: desktop
        run: node tools/make-icons.mjs

      - name: Abhängigkeiten installieren
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Installer bauen
        working-directory: desktop
        # electron-builder lädt beim ersten Lauf Electron selbst herunter,
        # das dauert einige Minuten.
        run: npm run build:win

      - name: Ergebnis anhängen
        uses: actions/upload-artifact@v4
        with:
          name: Streamo-Windows-Installer
          # Nur den Installer und die Prüfsummen, nicht das gesamte
          # entpackte Programmverzeichnis (mehrere hundert Megabyte).
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
          retention-days: 90
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Prüfung: Heißt die Datei wirklich so, wie latest.yml es behauptet?
      # ---------------------------------------------------------------------
      # Genau daran ist die Selbstaktualisierung lange gescheitert, ohne dass
      # es jemand gemerkt hat:
      #
      # electron-builder nannte den Installer von sich aus
      # "Streamo Setup 1.1.0.exe" – mit Leerzeichen. In die latest.yml schrieb
      # es aber "Streamo-Setup-1.1.0.exe" mit Bindestrichen. GitHub wiederum
      # ersetzt beim Hochladen jedes Leerzeichen durch einen Punkt, sodass auf
      # der Veröffentlichung "Streamo.Setup.1.1.0.exe" landete. Die App fragte
      # nach der Fassung mit Bindestrichen und bekam ein 404 – im Hintergrund,
      # also unsichtbar.
      #
      # Behoben ist das über "artifactName" in desktop/package.json: Ein Name
      # ohne Leerzeichen lässt GitHub unverändert. Dieser Schritt sorgt dafür,
      # dass der Fehler nicht unbemerkt zurückkommt – er bricht den Bau ab,
      # bevor eine kaputte Veröffentlichung entsteht.
      - name: Dateinamen gegen latest.yml prüfen
        shell: bash
        run: |
          set -euo pipefail
          cd desktop/dist

          # Der Name, den die App später anfragen wird.
          erwartet="$(grep -m1 '^path:' latest.yml | sed 's/^path:[[:space:]]*//' | tr -d '\r')"
          echo "latest.yml verweist auf: $erwartet"

          if [ ! -f "$erwartet" ]; then
            echo "::error::latest.yml verweist auf '$erwartet', diese Datei gibt es aber nicht."
            echo "Vorhanden ist stattdessen:"
            ls -1
            exit 1
          fi

          # Leerzeichen im Namen sind der eigentliche Ausloeser – GitHub macht
          # daraus Punkte, und die Adresse stimmt nicht mehr.
          case "$erwartet" in
            *" "*)
              echo "::error::Der Dateiname enthaelt ein Leerzeichen. GitHub wuerde daraus einen Punkt machen."
              exit 1
              ;;
          esac

          echo "Passt: $erwartet liegt bereit und traegt keine Leerzeichen."

      - name: An die Veröffentlichung hängen
        # Nur bei einem Tag – dann entsteht eine dauerhafte Download-Seite.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        # Angehängt werden drei Dinge: der Installer selbst, die latest.yml
        # (daraus liest die App, ob es etwas Neues gibt) und die Blockmap.
        # Letztere ist neu dabei – mit ihr lädt electron-updater beim nächsten
        # Mal nur die geänderten Teile statt der vollen 110 MB. Fehlt sie,
        # meldet die App einen Fehler und lädt alles noch einmal.
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.exe.blockmap
          # Der Text der Veröffentlichung wird aus den Commits erzeugt.
          generate_release_notes: true
          body: |
            ## Streamo für Windows

            **Streamo-Setup-*.exe** herunterladen und ausführen.

            Beim ersten Start fragt die App nach der Adresse deines
            Streamo-Servers – dieselbe, die du im Browser aufrufst.

            > Windows zeigt beim ersten Start eine SmartScreen-Warnung, weil der
            > Installer nicht signiert ist. Über *Weitere Informationen* →
            > *Trotzdem ausführen* geht es weiter.

            Der Server selbst wird auf Proxmox installiert:
            ```
            bash -c "$(curl -fsSL https://raw.githubusercontent.com/MoinMornhart/Streamo/main/scripts/streamo.sh)"
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
