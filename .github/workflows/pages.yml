# Webseite: baut site/ (Startseite + Doku, de/en) und veröffentlicht sie auf
# GitHub Pages – https://moinmornhart.github.io/Streamo/
#
# Verknüpfungen:
#   - site/build.mjs  -> setzt site/pages/*.html in site/layout.html, kopiert
#                        Stil, Skript und die Bildschirmfotos aus docs/img
#   - docs/img/**     -> dieselben Bilder wie im README; ändern sie sich, wird
#                        die Seite neu gebaut
name: Webseite

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/img/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Lauf zur Zeit – ein neuer Push überholt einen laufenden.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Seite bauen
        run: node site/build.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
